buildscript {
    ext {
        opensearch_version = project.opensearch_version
    }

    repositories {
        mavenLocal()
        maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
    }
}

apply plugin: 'java'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'opensearch.pluginzip'
apply plugin: 'opensearch.java-agent'
apply plugin: 'com.google.protobuf'
publishing {
    publications {
        pluginZip(MavenPublication) { publication ->
            pom {
                name = pluginName
                description = pluginDescription
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        name = "OpenSearch Contributors"
                        url = "https://github.com/SAP/opensearch-otlp-receiver"
                    }
                }
            }
        }
    }
}

opensearchplugin {
    name pluginName
    description pluginDescription
    classname pluginClassname
    licenseFile rootProject.file('LICENSE')
    noticeFile rootProject.file('NOTICE.txt')
    extendedPlugins = ['transport-grpc']
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.8'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.75.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// The opentelemetry-proto JAR bundles google/protobuf well-known types alongside the OTel
// proto definitions.  Re-generating them would produce com.google.protobuf.* classes that
// duplicate OpenSearch's lib/protobuf-java and fail the jar hell checker.  Delete them after
// extraction so protoc only compiles the opentelemetry.proto.* packages.
tasks.matching { it.name == 'extractProto' }.configureEach {
    doLast {
        delete layout.buildDirectory.dir("extracted-protos/main/google")
    }
}

// Disable checks not relevant for this plugin
thirdPartyAudit.enabled = false
loggerUsageCheck.enabled = false
validateNebulaPom.enabled = false
testingConventions.enabled = false

tasks.named("publishNebulaPublicationToMavenLocal").configure { enabled = false }

repositories {
    mavenLocal()
    maven { url "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    mavenCentral()
    maven { url "https://plugins.gradle.org/m2/" }
}

// ── Shading ───────────────────────────────────────────────────────────────────
//
// The plugin uses OpenSearch's bundled protobuf-java (3.x in lib/) and must NOT
// bundle it again — that would fail the jar hell checker.  gRPC and Netty are
// provided by the transport-grpc module at runtime (via extendedPlugins).
// Only a handful of proto utility deps remain in the fat jar.
//
// The Shadow plugin is NOT applied at the project level to avoid a compatibility
// issue with opensearch.publish (which calls getByName("shadow") inside a
// withPlugin callback before Shadow 9.x registers its component lazily).
// Instead, a ShadowJar task is registered directly using the task type from the
// shadow-gradle-plugin jar that build-tools already bundles.
// ─────────────────────────────────────────────────────────────────────────────

configurations.all {
    resolutionStrategy.force 'com.google.protobuf:protobuf-java:3.25.8'
    resolutionStrategy.force 'com.google.guava:guava:33.4.0-jre'
    resolutionStrategy.force 'com.google.api.grpc:proto-google-common-protos:2.63.2'
    resolutionStrategy.force 'com.google.errorprone:error_prone_annotations:2.36.0'
}

tasks.register('shadedJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = 'all'

    // Absorb only jars the plugin must provide itself.  resolveableCompileOnly is
    // the set of "provided" artifacts computed by opensearch.opensearchplugin; it
    // includes protobuf-java (from OpenSearch lib/) and gRPC/Netty (from transport-grpc),
    // so those jars are excluded here.
    configurations = []
    with jar
    from({
        def provided = project.configurations.resolveableCompileOnly
            .resolvedConfiguration.resolvedArtifacts
            .collect { it.file } as Set
        project.configurations.runtimeClasspath
            .findAll { !(it in provided) }
            .collect { zipTree(it) }
    })

    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

tasks.named('bundlePlugin').configure {
    dependsOn shadedJar
    // All runtime deps are merged into the fat shaded jar.
    // Use eachFile to drop all loose dep jars at copy time (they are absorbed).
    // The plain plugin jar is also excluded (its classes are in shadedJar).
    from(shadedJar.archiveFile) {
        rename { "${project.name}-${project.version}.jar" }
    }
    eachFile { details ->
        // Drop any jar that is NOT the shaded jar we just added via from().
        // The shaded jar was renamed, so it arrives as the canonical plugin jar name.
        String name = details.sourceName
        if (name.endsWith('.jar') && name != "${project.name}-${project.version}-all.jar") {
            details.exclude()
        }
    }
    includeEmptyDirs = false
}

dependencies {
    // OTLP proto sources are extracted from the opentelemetry-proto artifact by the
    // com.google.protobuf plugin and compiled by protoc 3.25.8.  The extractProto hook
    // above removes the bundled google/protobuf well-known types before code generation.
    // protobuf-java is NOT bundled — OpenSearch ships it in lib/ (3.25.8).
    protobuf 'io.opentelemetry.proto:opentelemetry-proto:1.10.0-alpha'

    // gRPC and transport-grpc SPI are provided by the transport-grpc module at runtime
    // (declared in extendedPlugins above); we only need them on the compile classpath.
    compileOnly "org.opensearch.plugin:transport-grpc-spi:${opensearch_version}"
    compileOnly 'io.grpc:grpc-api:1.75.0'
    compileOnly 'io.grpc:grpc-stub:1.75.0'
    compileOnly 'io.grpc:grpc-protobuf:1.75.0'
    // protoc-gen-grpc-java generates FutureStub code that references ListenableFuture.
    // Guava is not bundled — it is provided at runtime by the transport-grpc module.
    compileOnly 'com.google.guava:guava:33.4.0-jre'

    // proto-google-common-protos provides com.google.rpc.RetryInfo used by
    // RetryInfoCalculator. Not shipped by OpenSearch; must be bundled.
    implementation 'com.google.api.grpc:proto-google-common-protos:2.63.2'

    // IT tests call service.export() directly — no gRPC network connection needed.
    // grpc-api/stub/protobuf are compileOnly (visible at test compile via compileClasspath)
    // but must also be on the test runtime classpath.
    testRuntimeOnly 'io.grpc:grpc-api:1.75.0'
    testRuntimeOnly 'io.grpc:grpc-stub:1.75.0'
    testRuntimeOnly 'io.grpc:grpc-protobuf:1.75.0'
    testRuntimeOnly 'com.google.guava:guava:33.4.0-jre'

    // Unit tests (document/transform) serialize to XContent JSON and parse back with Jackson 2.x.
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-core:2.22.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
}

test {
    include '**/*Tests.class', '**/*IT.class'
}

processResources {
    filesMatching('plugin-info.properties') {
        expand(version: project.version)
    }
}

// Print more details if any deprecated APIs are used
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
