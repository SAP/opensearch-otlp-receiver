entry-pipeline:
  delay: 100
  source:
    otel_trace_source:
      port: 21890
      ssl: false
  buffer:
    bounded_blocking:
      buffer_size: 65536
      batch_size: 512
  sink:
    - pipeline:
        name: raw-pipeline
    - pipeline:
        name: service-map-pipeline

raw-pipeline:
  source:
    pipeline:
      name: entry-pipeline
  processor:
    - otel_traces:
        # Data Prepper's 180-second default obscures benchmark drain time.
        trace_flush_interval: 1
  sink:
    - opensearch:
        hosts: ["http://opensearch-baseline:9200"]
        insecure: true
        index_type: trace-analytics-raw
        # Avoid making the 60-second default sink flush the dominant latency.
        flush_timeout: 1000

service-map-pipeline:
  delay: 100
  source:
    pipeline:
      name: entry-pipeline
  processor:
    - otel_apm_service_map:
        # Three one-second windows provide correlation without a minute-long wait.
        window_duration: PT1S
  sink:
    - opensearch:
        hosts: ["http://opensearch-baseline:9200"]
        insecure: true
        index_type: trace-analytics-service-map
        flush_timeout: 1000
