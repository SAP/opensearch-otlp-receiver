receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 100
    timeout: 5s

  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]

exporters:
  # Forward to the OpenSearch OTLP plugin via gRPC.
  # tls.insecure skips certificate verification — correct for the dev setup
  # where OpenSearch runs plain transport-grpc (no TLS).  For a production
  # deployment using secure-transport-grpc, replace with:
  #
  #   tls:
  #     ca_file: /path/to/root-ca.pem       # verifies the server certificate
  #     cert_file: /path/to/client.pem      # client cert for mTLS (REQUIRE mode)
  #     key_file:  /path/to/client-key.pem  # client key  for mTLS (REQUIRE mode)
  otlp/opensearch:
    endpoint: opensearch:4317
    tls:
      insecure: true  # dev only — plain HTTP/2, no TLS

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/opensearch, debug]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/opensearch, debug]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/opensearch, debug]
